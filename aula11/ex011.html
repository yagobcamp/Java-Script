<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasileiro ou Estrangeiro?</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            font-size: large;
        }

        h1 {
             text-align: center;
        }

        input {
            display: block;
            margin: auto;
        }

        .brasil {
            text-align: center;
            color: green;
        }

        .estrangeiro {
            text-align: center;
            color: red;
        }
    </style>
</head>
<body>
    <h1> Qual país você nasceu? </h1>
    <input type="text" name="txtpais" id="txtpais"> <br>
    <input type="button" value="verificar" onclick = "validar()"> <br>
    <div id="res">

    </div>

    <script>
        function validar(){
            var pais = window.document.querySelector('#txtpais').value
            var res = window.document.querySelector('div#res')
                if (pais == `Brasil`){
            res.innerHTML += `   <p class="brasil">Voce é brasileiro!</p> `
               } else {
            res.innerHTML += `  <p class="estrangeiro"> Voce é estrangeiro!</p> `
               }
        }
    </script>
</body>
</html>
